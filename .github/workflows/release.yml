name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Validate release tag and resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ] || [[ "${GITHUB_REF:-}" != refs/tags/v* ]]; then
            echo "::error::Release workflow must run on a v* tag (got ref '${GITHUB_REF:-}')."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' must be a canonical SemVer version without build metadata (e.g. v0.1.0 or v0.1.0-rc.1)."
            exit 1
          fi

          PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          fi

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install Linux Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Lint
        run: dotnet build -t:Lint

      - name: Run tests
        run: dotnet run --project tests/Csff.Tests -c Release

      - name: Pack and smoke-test pointer and portable (any) tool packages
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          dotnet pack src/Csff.Cli/Csff.Cli.fsproj \
            -c Release \
            -p:Version="$RELEASE_VERSION" \
            -o ./out/pointer-nupkgs
          dotnet run scripts/test-tool-package.cs -- \
            --package-source ./out/pointer-nupkgs \
            --package-id csff.any \
            --version "$RELEASE_VERSION" \
            --expected-rid any
          mkdir -p ./out/pointer-only ./out/any-only
          mv "./out/pointer-nupkgs/csff.${RELEASE_VERSION}.nupkg" ./out/pointer-only/
          mv "./out/pointer-nupkgs/csff.any.${RELEASE_VERSION}.nupkg" ./out/any-only/

      - name: Upload pointer tool package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pointer-nupkg
          path: ./out/pointer-only/*.nupkg
          if-no-files-found: error

      - name: Upload portable (any) tool package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impl-nupkg-any
          path: ./out/any-only/*.nupkg
          if-no-files-found: error

  pack-rid:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      TARGET_RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Download pointer tool package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pointer-nupkg
          path: ./out/tool-feed

      - name: Pack Native AOT .NET tool package (${{ matrix.rid }})
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Csff.Cli/Csff.Cli.fsproj \
            -c Release \
            -r "$TARGET_RID" \
            -p:PublishAot=true \
            -p:Version="$RELEASE_VERSION" \
            -o ./out/nupkgs

      - name: Smoke-test Native AOT .NET tool package (${{ matrix.rid }})
        shell: bash
        run: |
          set -euo pipefail
          cp ./out/nupkgs/*.nupkg ./out/tool-feed/
          dotnet run scripts/test-tool-package.cs -- \
            --package-source ./out/tool-feed \
            --version "$RELEASE_VERSION" \
            --expected-rid "$TARGET_RID"

      - name: Publish and archive standalone native binary (${{ matrix.rid }})
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Csff.Cli/Csff.Cli.fsproj \
            -c Release \
            -r "$TARGET_RID" \
            -p:PublishAot=true \
            -p:Version="$RELEASE_VERSION" \
            -o "./out/publish/$TARGET_RID"
          dotnet run scripts/package-native.cs -- \
            --rid "$TARGET_RID" \
            --publish-directory "./out/publish/$TARGET_RID" \
            --output-directory ./out/releases \
            --version "$RELEASE_VERSION"

      - name: Upload RID NuGet package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impl-nupkg-${{ matrix.rid }}
          path: ./out/nupkgs/*.nupkg
          if-no-files-found: error

      - name: Upload standalone release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: ./out/releases/*
          if-no-files-found: error

  pack-rid-musl:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-musl-x64
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      TARGET_RID: ${{ matrix.rid }}
      ALPINE_AOT_IMAGE: mcr.microsoft.com/dotnet/sdk:11.0.100-alpine3.24-aot@sha256:a6a89666d050f5d4806aa03edbc677291c7fb92191b5b2a8f3bccdec869ab87a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download pointer tool package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pointer-nupkg
          path: ./out/tool-feed

      - name: Pack, smoke-test, and archive Alpine musl Native AOT (${{ matrix.rid }})
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e RELEASE_VERSION \
            -e TARGET_RID \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            "$ALPINE_AOT_IMAGE" \
            sh -eu -c '
              trap '\''chown -R "$HOST_UID:$HOST_GID" /src/out /src/src 2>/dev/null || true'\'' EXIT
              apk add --no-cache git
              git config --global --add safe.directory /src
              dotnet pack src/Csff.Cli/Csff.Cli.fsproj \
                -c Release \
                -r "$TARGET_RID" \
                -p:PublishAot=true \
                -p:Version="$RELEASE_VERSION" \
                -o ./out/nupkgs
              cp ./out/nupkgs/*.nupkg ./out/tool-feed/
              dotnet run scripts/test-tool-package.cs -- \
                --package-source ./out/tool-feed \
                --version "$RELEASE_VERSION" \
                --expected-rid "$TARGET_RID"
              dotnet publish src/Csff.Cli/Csff.Cli.fsproj \
                -c Release \
                -r "$TARGET_RID" \
                -p:PublishAot=true \
                -p:Version="$RELEASE_VERSION" \
                -o "./out/publish/$TARGET_RID"
              dotnet run scripts/package-native.cs -- \
                --rid "$TARGET_RID" \
                --publish-directory "./out/publish/$TARGET_RID" \
                --output-directory ./out/releases \
                --version "$RELEASE_VERSION"
            '

      - name: Upload RID NuGet package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impl-nupkg-${{ matrix.rid }}
          path: ./out/nupkgs/*.nupkg
          if-no-files-found: error

      - name: Upload standalone release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: ./out/releases/*
          if-no-files-found: error

  publish:
    needs: [verify, pack-rid, pack-rid-musl]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Verify existing NuGet package provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          version = os.environ["RELEASE_VERSION"].lower()
          expected_sha = os.environ["GITHUB_SHA"].lower()
          packages = [
              "csff",
              "csff.any",
              "csff.linux-x64",
              "csff.linux-arm64",
              "csff.linux-musl-x64",
              "csff.linux-musl-arm64",
              "csff.osx-x64",
              "csff.osx-arm64",
              "csff.win-x64",
              "csff.win-arm64",
          ]

          for pkg in packages:
              url = f"https://api.nuget.org/v3-flatcontainer/{pkg}/{version}/{pkg}.nuspec"
              req = urllib.request.Request(url, headers={"User-Agent": "csff-release-workflow"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      continue
                  print(f"::error::Unexpected HTTP {err.code} checking {url}", file=sys.stderr)
                  sys.exit(1)

              root = ET.fromstring(body)
              repo = next((el for el in root.iter() if el.tag.endswith("repository")), None)
              actual_sha = (repo.attrib.get("commit", "") if repo is not None else "").lower()
              if actual_sha != expected_sha:
                  print(
                      f"::error::{pkg} {version} already exists on NuGet.org for commit '{actual_sha or '<none>'}', expected '{expected_sha}'.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print(f"Verified existing {pkg} {version} matches commit {expected_sha}.")
          PY

      - name: Download pointer tool package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pointer-nupkg
          path: ./out/pointer-nupkgs

      - name: Download implementation tool packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: impl-nupkg-*
          path: ./out/rid-nupkgs
          merge-multiple: true

      - name: Download standalone release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ./out/release-assets
          merge-multiple: true

      - name: Verify downloaded tool packages
        shell: bash
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 osx-x64 osx-arm64 win-x64 win-arm64 any; do
            test -f "./out/rid-nupkgs/csff.${rid}.${RELEASE_VERSION}.nupkg"
          done
          test -f "./out/pointer-nupkgs/csff.${RELEASE_VERSION}.nupkg"

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push RID-specific and portable tool packages to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for pkg in ./out/rid-nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Wait for implementation packages to become downloadable on NuGet.org
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_VERSION"].lower()
          pending = [
              "csff.any",
              "csff.linux-x64",
              "csff.linux-arm64",
              "csff.linux-musl-x64",
              "csff.linux-musl-arm64",
              "csff.osx-x64",
              "csff.osx-arm64",
              "csff.win-x64",
              "csff.win-arm64",
          ]

          deadline = time.monotonic() + 600
          while pending:
              still_pending = []
              for pkg in pending:
                  url = f"https://api.nuget.org/v3-flatcontainer/{pkg}/{version}/{pkg}.{version}.nupkg"
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "csff-release-workflow"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          if resp.status == 200:
                              print(f"Available on NuGet.org: {pkg} {version}")
                              continue
                  except urllib.error.HTTPError as err:
                      if err.code != 404:
                          print(f"Transient HTTP {err.code} for {pkg}: {err}", file=sys.stderr)
                  except urllib.error.URLError as err:
                      print(f"Transient network error for {pkg}: {err}", file=sys.stderr)
                  still_pending.append(pkg)

              pending = still_pending
              if not pending:
                  break
              if time.monotonic() >= deadline:
                  print(f"::error::Timed out waiting for NuGet.org indexing: {', '.join(pending)}", file=sys.stderr)
                  sys.exit(1)
              print(f"Waiting 15s for NuGet.org indexing ({len(pending)} remaining): {', '.join(pending)}")
              time.sleep(15)
          PY

      - name: Push top-level pointer tool package to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "./out/pointer-nupkgs/csff.${RELEASE_VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ./out/release-assets/*
